name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/meepok17/audit-svc

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install poetry
          poetry install
      - name: pytest
        run: poetry run pytest --junitxml=report.xml
      - name: upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: image tag and build date
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main_${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct -- Dockerfile .dockerignore pyproject.toml poetry.lock README.md src)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
      - name: image digest
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.tag }}"

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, deploy]
    environment:
      name: production
      url: http://localhost:8088
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: ansible
        working-directory: deploy
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook audit-svc.play.yml -e image_tag=${{ needs.build.outputs.tag }}
